<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ali Rashed — Multimedia Designer</title>
  <meta name="description" content="Portfolio of Ali Rashed — Multimedia Designer specializing in UI/UX, Graphic Design, Motion, and AI Visuals. Based in Dubai." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="index.css" />
</head>
<body>

  <!-- ============================
       HERO
       ============================ -->
  <section class="hero" id="hero">

    <!-- Meta bar -->
    <div class="hero__meta-bar">
      <span class="hero__meta">Portfolio</span>
      <span class="hero__meta">2026 / DXB</span>
    </div>

    <hr class="hero__rule" />

    <!-- Main content -->
    <div class="hero__content">

      <!-- Title -->
      <h1 class="hero__title">
        Multimedia<br />Designer
      </h1>

      <!-- Portrait -->
      <div class="hero__portrait-wrap">
        <img
          class="hero__portrait"
          src="portrait.jpg"
          alt="Portrait of Ali Rashed, Multimedia Designer"
          width="800"
          height="1067"
        />
      </div>

      <!-- Designer name -->
      <p class="hero__name">Ali Rashed</p>

      <!-- Bottom section -->
      <div class="hero__bottom">

        <!-- Disciplines -->
        <ul class="hero__disciplines">
          <li class="hero__discipline">UI/UX</li>
          <li class="hero__discipline">Graphic</li>
          <li class="hero__discipline">Motion</li>
          <li class="hero__discipline">AI Visuals</li>
        </ul>

        <!-- Actions -->
        <div class="hero__actions">
          <a href="#work" class="hero__cta-primary" id="cta-view-work">
            View Selected Work
            <span class="hero__cta-arrow">→</span>
          </a>
          <a href="#" class="hero__cta-secondary" id="cta-download-cv">
            Download CV
            <span class="hero__cta-arrow">↓</span>
          </a>
        </div>

      </div>

    </div>

  </section>

</body>
</html>
